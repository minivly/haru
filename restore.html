<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 되살리기</title>
<style>
  body{margin:0; padding:26px 18px; background:#15181A; color:#E7EAE6;
       font:17px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}
  .box{max-width:620px; margin:0 auto}
  h1{font-size:23px; font-weight:600; margin:0 0 6px}
  p.lead{color:#8B938F; margin:0 0 20px}
  .card{background:#1D2124; border-radius:14px; padding:16px; margin-bottom:14px;
        display:flex; gap:14px; align-items:flex-start}
  .card img{width:96px; height:96px; object-fit:cover; border-radius:10px; flex:none}
  .meta{flex:1; min-width:0; font-size:15px; color:#8B938F; line-height:1.6}
  .meta b{color:#E7EAE6; font-weight:600}
  .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  input{background:#15181A; border:1px solid #2B3033; border-radius:9px;
        padding:8px 11px; color:#E7EAE6; font:inherit; font-size:15px}
  input[type=date]{width:150px}
  button{background:#E48067; color:#15181A; border:0; border-radius:9px;
         padding:8px 16px; font:inherit; font-size:15px; font-weight:600; cursor:pointer}
  button:disabled{opacity:.5; cursor:default}
  pre{background:#1D2124; border-radius:10px; padding:14px; white-space:pre-wrap;
      font-size:14px; line-height:1.6; color:#B9C2BD}
</style>
</head>
<body>
<div class="box">
  <h1>사진 되살리기</h1>
  <p class="lead">기록에서 지워졌지만 보관함에는 남아 있는 사진을 찾아 되돌립니다.</p>
  <div id="list"></div>
  <pre id="log">불러오는 중…</pre>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.58.0';

const sb = createClient(
  'https://uexetbzmpfqnrjzdnmfz.supabase.co',
  'sb_publishable_QGrahkpLkXcO_X5p7V0tBA_9k6aSMRa'
);
const photoUrl = p => `https://uexetbzmpfqnrjzdnmfz.supabase.co/storage/v1/object/public/photos/${p}`;
const log = m => { document.getElementById('log').textContent = m; };
const today = new Date();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const { data: { session } } = await sb.auth.getSession();
if (!session) {
  log('로그인되어 있지 않습니다. 앱에서 로그인한 뒤 이 페이지를 다시 열어 주세요.');
} else {
  const uid = session.user.id;

  // 보관함의 사진 전부
  const { data: files, error: e1 } = await sb.storage.from('photos')
    .list(uid, { limit: 500, sortBy: { column: 'created_at', order: 'desc' } });
  if (e1) log('보관함을 읽지 못했습니다 — ' + e1.message);

  // 기록이 가리키고 있는 사진
  const { data: rows, error: e2 } = await sb.from('days').select('date, items');
  if (e2) log('기록을 읽지 못했습니다 — ' + e2.message);

  const used = new Set();
  for (const r of rows || []) for (const it of r.items || []) {
    if (it.photo) { used.add(it.photo.full); used.add(it.photo.thumb); }
  }

  const orphans = (files || [])
    .map(f => ({ path: `${uid}/${f.name}`, size: f.metadata?.size || 0, at: f.created_at }))
    .filter(f => !used.has(f.path));

  if (!orphans.length) {
    log('가리키는 기록이 없는 사진은 없습니다. 지운 사진이 보관함에서도 사라졌거나, 아직 어딘가에 붙어 있습니다.');
  } else {
    // 같은 사진의 본문용/썸네일용은 올린 시각이 거의 같다 — 큰 쪽이 본문용
    const pairs = [];
    const rest = [...orphans].sort((a, b) => new Date(b.at) - new Date(a.at));
    while (rest.length) {
      const first = rest.shift();
      const i = rest.findIndex(o => Math.abs(new Date(o.at) - new Date(first.at)) < 20000);
      const second = i >= 0 ? rest.splice(i, 1)[0] : null;
      const [full, thumb] = second
        ? (first.size >= second.size ? [first, second] : [second, first])
        : [first, first];
      pairs.push({ full: full.path, thumb: thumb.path, at: full.at, size: full.size });
    }

    log(`되살릴 수 있는 사진 ${pairs.length}장을 찾았습니다.`);
    const listEl = document.getElementById('list');

    pairs.forEach((pair, n) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${photoUrl(pair.thumb)}" alt="">
        <div class="meta">
          <b>올린 때</b> ${new Date(pair.at).toLocaleString('ko-KR')}<br>
          <b>크기</b> ${Math.round(pair.size / 1024)}KB
          <div class="row">
            <input type="date" value="${ymd(today)}">
            <input type="text" placeholder="함께 적을 말 (비워도 됩니다)" style="flex:1; min-width:160px">
            <button>이 날짜에 되살리기</button>
          </div>
        </div>`;
      const [dateEl, textEl] = card.querySelectorAll('input');
      const btn = card.querySelector('button');

      btn.onclick = async () => {
        btn.disabled = true;
        const date = dateEl.value;
        const { data: row } = await sb.from('days').select('items').eq('date', date).maybeSingle();
        const items = row?.items || [];
        items.push({
          id: crypto.randomUUID(), kind: 'note', time: null,
          text: textEl.value.trim(),
          photo: { full: pair.full, thumb: pair.thumb },
        });
        const { error } = await sb.from('days')
          .upsert({ user_id: uid, date, items, updated_at: new Date().toISOString() });
        if (error) { log('되살리지 못했습니다 — ' + error.message); btn.disabled = false; return; }
        log(`${date} 에 되살렸습니다. 앱에서 확인해 보세요.`);
        btn.textContent = '되살렸습니다';
      };
      listEl.append(card);
    });
  }
}
</script>
</body>
</html>
