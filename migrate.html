<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 옮기기</title>
<style>
  body{margin:0; padding:28px 20px; background:#15181A; color:#E7EAE6;
       font:17px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}
  .box{max-width:560px; margin:0 auto}
  h1{font-size:23px; font-weight:600; margin:0 0 6px}
  p{color:#8B938F; margin:0 0 20px}
  button{background:#E48067; color:#15181A; border:0; border-radius:10px;
         padding:12px 22px; font:inherit; font-weight:600; cursor:pointer}
  button:disabled{opacity:.5; cursor:default}
  pre{background:#1D2124; border-radius:10px; padding:14px; margin-top:18px;
      white-space:pre-wrap; font-size:14px; line-height:1.6; color:#B9C2BD}
  a{color:#E48067}
</style>
</head>
<body>
<div class="box">
  <h1>기록 옮기기</h1>
  <p>아티팩트에 쌓아둔 날짜·기록·사진을 이 계정으로 한 번만 옮깁니다.</p>
  <button id="go">옮기기 시작</button>
  <pre id="log">준비됨.</pre>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.58.0';

const sb = createClient(
  'https://uexetbzmpfqnrjzdnmfz.supabase.co',
  'sb_publishable_QGrahkpLkXcO_X5p7V0tBA_9k6aSMRa'
);

// 아티팩트에서 그대로 옮겨온 내용. 사진은 migrate/ 폴더의 파일을 가리킨다.
const DAYS = [
  { date: '2026-09-20', items: [
    { id: 'f8d27921-124f-4dad-9dda-6749ea177bfa', kind: 'note', time: null,
      text: '오비탈스 완결까지 봤어!\n오버쿡드 처음 해봤는데 재밌더라' },
    { id: '0425da2d-5e26-4e98-9641-873b0963d47c', kind: 'note', time: null, text: '',
      photo: { full: 'b85334852a0219b8de4fdf1e16b48677', thumb: '19a8c7aa20a0f3e118e65ba8174de752' } },
  ]},
  { date: '2026-09-21', items: [
    { id: 'ad401094-1560-465a-b387-c0765cb241f4', text: '일정 앱 만들기', time: '13:55', done: false },
    { id: '59c7e6ae-eeec-41aa-94e4-4dcc4f2d15dd', text: '뭐하지?', time: '15:06', done: false },
    { id: '2420e025-4082-4ce1-9f1c-e391d087d29b', kind: 'note', time: null, text: '일정 앱 한 번 만들어 볼까?' },
    { id: '2b83a575-7f80-41be-bc4b-6c44ff184050', kind: 'note', time: null,
      text: '오늘 새로운 프롬프트로 귀여운 프로필 뽑았어',
      photo: { full: '3ed9ec8625b640afc05c90c26b2c92e6', thumb: 'f73440337ebd60453980c6db583d43b3' } },
    { id: 'cabe0bc2-8730-4fb0-8c5a-46dd26b8081c', kind: 'note', time: null, text: '좀 귀엽다 히히' },
  ]},
];

const logEl = document.getElementById('log');
const say = m => { logEl.textContent += '\n' + m; };

document.getElementById('go').onclick = async e => {
  e.target.disabled = true;
  logEl.textContent = '시작합니다…';

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    say('로그인되어 있지 않습니다. 먼저 앱에서 로그인한 뒤 이 페이지를 다시 열어 주세요.');
    e.target.disabled = false;
    return;
  }
  const uid = session.user.id;
  say('계정 확인: ' + session.user.email);

  const uploaded = new Map();                    // 같은 사진을 두 번 올리지 않는다
  async function movePhoto(assetId) {
    if (uploaded.has(assetId)) return uploaded.get(assetId);
    const res = await fetch('migrate/' + assetId + '.jpg');
    if (!res.ok) throw new Error('사진 파일을 찾지 못했습니다: ' + assetId);
    const blob = await res.blob();
    const path = `${uid}/${crypto.randomUUID()}.jpg`;
    const { error } = await sb.storage.from('photos')
      .upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    uploaded.set(assetId, path);
    return path;
  }

  try {
    for (const day of DAYS) {
      const items = structuredClone(day.items);
      for (const it of items) {
        if (!it.photo) continue;
        it.photo = { full: await movePhoto(it.photo.full), thumb: await movePhoto(it.photo.thumb) };
        say('사진 옮김 — ' + day.date);
      }
      const { error } = await sb.from('days')
        .upsert({ user_id: uid, date: day.date, items, updated_at: new Date().toISOString() });
      if (error) throw error;
      say(day.date + ' — 항목 ' + items.length + '개 옮김');
    }
    say('\n끝났습니다. 앱으로 돌아가 9월 20일과 21일을 확인해 보세요.');
    say('→ 앱 열기: ' + location.href.replace(/migrate\.html.*$/, ''));
  } catch (err) {
    say('\n실패: ' + (err.message || err));
    e.target.disabled = false;
  }
};
</script>
</body>
</html>
